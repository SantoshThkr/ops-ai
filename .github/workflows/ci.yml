name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest
      - name: Deterministic evaluation
        run: python -m app.evaluation

  backend-postgres:
    # Exercises what SQLite cannot: migrations, pgvector search, and row locking.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opsai
          POSTGRES_USER: opsai
          POSTGRES_PASSWORD: opsai-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsai -d opsai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://opsai:opsai-ci-only@localhost:5432/opsai
      TEST_DATABASE_URL: postgresql+psycopg://opsai:opsai-ci-only@localhost:5432/opsai
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check models match migrations
        run: alembic check
      - name: Downgrade and re-apply migrations
        run: alembic downgrade base && alembic upgrade head
      - name: Postgres integration tests
        run: pytest tests/test_postgres_integration.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Vitest
        run: npm run test:web
      - name: ESLint
        run: npm run lint:web
      - name: Production build
        run: npm run build:web
      - name: TypeScript
        run: npm run typecheck:web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration against .env.example
        run: docker compose --env-file .env.example -f infra/docker/docker-compose.yml config --quiet
