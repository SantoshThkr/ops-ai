[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opsai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.20.0,<2",
  "fastapi>=0.143.0,<1",
  "email-validator>=2.3.0,<3",
  "PyJWT>=2.15.1,<3",
  "pwdlib[argon2]>=0.3.1,<1",
  "psycopg[binary]>=3.3.6,<4",
  "pydantic-settings>=2.15.0,<3",
  "pgvector>=0.5.1,<1",
  "openai>=3.28.0,<4",
  "pypdf>=6.20.0,<7",
  "python-multipart>=0.0.32,<1",
  "redis>=8.1.0,<9",
  "sqlalchemy>=2.1.4,<3",
  "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.4.0,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.17.0,<1",
  "httpx>=0.28.1,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
